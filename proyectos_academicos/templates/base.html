<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Seguimiento Académico</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="{% url 'proyectos_academicos:lista_proyectos' %}">Seguimiento Académico</a>
            <div>
                {% if user.is_authenticated %}
                    <span class="text-white">Hola, {{ user.username }}</span>
                    <form action="{% url 'proyectos_academicos:logout' %}" method="post" style="display:inline">
                        {% csrf_token %}
                        <button type="submit" class="btn btn-outline-light btn-sm">Cerrar sesión</button>
                    </form>
                {% else %}
                    <a href="{% url 'proyectos_academicos:login' %}" class="btn btn-outline-light">Iniciar sesión</a>
                {% endif %}
            </div>
        </div>
    </nav>
    <div class="container mt-4">
        {% block content %}{% endblock %}
    </div>
</body>
</html>
